name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'css/**', 'js/**', 'manifest.webmanifest']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Scaffold Capacitor app (local snapshot of the site)
        run: |
          mkdir -p app/www
          cp index.html manifest.webmanifest icon.svg app/www/
          cp -r css js app/www/
          cd app
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init DuoScore com.dali951.duoscore --web-dir www
          npx cap add android
          npx cap sync android

      - name: Branded launcher icons
        run: |
          python3 -m pip install --quiet Pillow
          python3 build/icon.py \
            --res-dir app/android/app/src/main/res \
            --colors app/android/app/src/main/res/values/colors.xml

      - name: Build debug APK
        run: cd app/android && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: duoscore-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error